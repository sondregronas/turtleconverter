name: Pages

on:
  push:
    branches: [ main ]

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Python packages
        run: uv pip install --system -e .

      - name: Create demo
        run: |
          cd ./turtleconverter
          python ./__init__.py
          cd ..
          mkdir -p ./site
          mv ./turtleconverter/static ./site
          mv ./turtleconverter/img.png ./site/static
          sed -i 's|src="/img.png"|src="/turtleconverter/static/img.png"|g' ./site/static/test.html
          echo "<meta http-equiv='refresh' content='0; url=static/test.html'>" > ./site/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          artifact-name: github-pages
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
